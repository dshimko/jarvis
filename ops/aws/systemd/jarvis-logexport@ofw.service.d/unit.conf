# Drop-in for jarvis-logexport@ofw.service: ofw-mcp is not a jarvis@<mode> daemon, so this
# instance must export a different unit's journal (PLAN.md AD37). Environment= here is read
# after the template's own Environment= line, so it overrides it (systemd.exec(5): the later
# setting of the same variable wins) rather than adding a second value.
[Unit]
Before=ofw-mcp.service

[Service]
Environment=JARVIS_LOGEXPORT_UNIT=ofw-mcp.service
