; Drop-in for the Debian/Ubuntu package's syncthing@.service template, where %i is the *username*
; (jarvis-work / jarvis-personal) -- the package unit already sets User=%i and Group=%i.
; infra/DESIGN.md sections 6.3 and AD8 tightened: Syncthing must never start without a freshly
; rendered, Tailscale-IP-bound config, so the render step is ExecStartPre with no "+" (PLAN.md
; AD31: runs entirely as the mode user; `tailscale ip -4` works unprivileged).
[Unit]
Requires=jarvis-imds-guard.service
After=jarvis-imds-guard.service tailscaled.service
Wants=tailscaled.service
StartLimitIntervalSec=0

[Service]
# %h resolves to the SERVICE MANAGER's home (root, /root) in a system unit, never to User=%i's
# home, even though the package unit sets User=%i -- a well-known systemd specifier gotcha (H1).
# Use /home/%i explicitly everywhere a home directory is meant.
ExecStartPre=/opt/jarvis/libexec/jarvis-syncthing-render %i
ExecStart=
ExecStart=/usr/bin/syncthing serve --no-browser --no-restart --home=/home/%i/.local/state/syncthing
Restart=on-failure
RestartSec=10
Environment=STNOUPGRADE=1
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/home/%i
ProtectHome=tmpfs
BindPaths=/home/%i
PrivateTmp=yes
ProtectProc=invisible
ProcSubset=pid
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LimitCORE=0
